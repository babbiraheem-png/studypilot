<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b70"><title>StudyPilot · QR Admin</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d3048;background:#f2f7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#e0edff,transparent 30%),#f4f7fc}.shell{max-width:1120px;margin:auto;padding:30px 20px}.brand{font-size:20px;font-weight:900;color:#2869b8;letter-spacing:-.04em}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:26px}.top small{display:block;color:#8090a5;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:5px}.card{background:white;border:1px solid #dce6f2;border-radius:19px;padding:22px;box-shadow:0 12px 35px #173c680c}.login{max-width:430px;margin:12vh auto}.login h1{margin:10px 0;font-size:28px;letter-spacing:-.04em}p,.muted{color:#718198;font-size:13px;line-height:1.55}label{display:block;font-size:13px;font-weight:750;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #cfdbeb;border-radius:11px;font:inherit}button{border:0;border-radius:10px;background:#286fc4;color:white;font-weight:800;padding:11px 14px;cursor:pointer}button.secondary{background:#edf4fd;color:#285b93}button.danger{background:#fff0f0;color:#a53a48}button:disabled{opacity:.55}.full{width:100%;margin-top:17px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat b{font-size:27px;display:block;margin-top:8px}.stat span{color:#72839a;font-size:12px}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 13px}.request{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:15px 0;border-top:1px solid #edf1f6}.request:first-child{border-top:0}.who{font-weight:800}.meta{font-size:12px;color:#8190a4;margin-top:5px}.pill{display:inline-block;margin-left:7px;padding:4px 8px;border-radius:20px;background:#edf4fd;color:#285b93;font-size:10px;text-transform:uppercase}.pill.approved{background:#e8f7ef;color:#23734a}.pill.rejected,.pill.revoked{background:#fff0f0;color:#a53a48}.actions{display:flex;gap:7px;flex-wrap:wrap}.review{padding:13px;border:1px solid #e5ebf3;border-radius:12px;margin:9px 0}.stars{color:#d18b18;letter-spacing:2px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.empty{padding:18px;background:#f7faff;border-radius:12px;color:#8492a5;font-size:13px}@media(max-width:700px){.shell{padding:18px 13px}.stats{grid-template-columns:repeat(2,1fr)}.request{align-items:flex-start;flex-direction:column}.actions button{flex:1}.top{align-items:flex-start}}
</style></head><body><div class="shell"><header class="top"><div><div class="brand">StudyPilot</div><small>QR approval · owner workspace</small></div><a href="/qr-visitor.html" class="muted">Visitor page ↗</a></header><main id="app"><section class="card login"><div class="brand">Private admin</div><h1>QR Approval</h1><p>Sign in with your existing owner code to manage science-fair visitor requests.</p><form id="login"><label for="pin">Owner code</label><input id="pin" type="password" autocomplete="current-password" required placeholder="Enter owner code"><button class="full">Unlock dashboard</button></form><p class="muted">This page is private. Do not share your owner code.</p></section></main></div><script>
const API='https://mxnhfvhvwqxjfctgfejf.supabase.co/functions/v1/studypilot-qr-access';
const KEY='sb_publishable_UdCozB9L-cEedEJgOq_t9w_Sl4aooYc';
const TOKEN_KEY='studypilotFairAccessToken';
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Approval service unavailable.');return d;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const app=document.getElementById('app');let pin='',enabled=true,refreshTimer=null;
function loginScreen(error=''){app.innerHTML='<section class="card login"><div class="brand">Private admin</div><h1>QR Approval</h1><p>Sign in with your existing owner code to manage science-fair visitor requests.</p>'+(error?'<p style="color:#b33">'+esc(error)+'</p>':'')+'<form id="login"><label for="pin">Owner code</label><input id="pin" type="password" autocomplete="current-password" required placeholder="Enter owner code"><button class="full">Unlock dashboard</button></form><p class="muted">This page is private. Do not share your owner code.</p></section>';document.getElementById('login').onsubmit=async e=>{e.preventDefault();pin=document.getElementById('pin').value;try{await load();if(refreshTimer)clearInterval(refreshTimer);refreshTimer=setInterval(()=>load(true).catch(()=>{}),15000);}catch(err){pin='';loginScreen(err.message);}};}
async function update(id,status){try{await call('admin-update',{admin_pin:pin,id,status});await load();}catch(e){alert(e.message);}}
async function toggle(){try{await call('admin-toggle',{admin_pin:pin,enabled:!enabled});await load();}catch(e){alert(e.message);}}
function render(data){const req=data.requests||[],reviews=data.reviews||[];enabled=data.access_enabled===true;const pending=req.filter(x=>x.status==='pending').length,approved=req.filter(x=>x.status==='approved').length;const avg=reviews.length?(reviews.reduce((a,x)=>a+Number(x.rating||0),0)/reviews.length).toFixed(1):'—';app.innerHTML='<div class="bar"><button onclick="toggle()">'+(enabled?'Pause new visitor requests':'Reopen visitor requests')+'</button><button class="secondary" onclick="load()">Refresh</button><button class="secondary" onclick="logout()">Lock dashboard</button></div><div class="stats"><section class="card stat"><span>Pending</span><b>'+pending+'</b></section><section class="card stat"><span>Approved</span><b>'+approved+'</b></section><section class="card stat"><span>Total requests</span><b>'+req.length+'</b></section><section class="card stat"><span>Review average</span><b>'+avg+'</b></section></div><section class="card section"><h2>Visitor requests</h2>'+(req.length?req.map(x=>'<article class="request"><div><div class="who">'+esc(x.visitor_name)+' <span class="pill '+esc(x.status)+'">'+esc(x.status)+'</span></div><div class="meta">'+esc(x.visitor_role)+' · '+new Date(x.created_at).toLocaleString('en-IN')+'</div></div><div class="actions">'+(x.status==='pending'?'<button onclick="update(\''+esc(x.id)+'\',\'approved\')">Approve</button><button class="danger" onclick="update(\''+esc(x.id)+'\',\'rejected\')">Reject</button>':x.status==='approved'?'<button class="danger" onclick="update(\''+esc(x.id)+'\',\'revoked\')">Revoke access</button>':'<button class="secondary" onclick="update(\''+esc(x.id)+'\',\'approved\')">Approve again</button>')+'</div></article>').join(''):'<div class="empty">No visitor requests yet. New requests will appear here.</div>')+'</section><section class="card section"><h2>Visitor feedback</h2>'+(reviews.length?reviews.map(x=>'<article class="review"><div class="who">'+esc(x.visitor_name)+' <span class="pill">'+esc(x.visitor_role)+'</span></div><div class="stars">'+('★'.repeat(Number(x.rating||0)))+('☆'.repeat(5-Number(x.rating||0)))+'</div><p>'+esc(x.review_text||'No written comment.')+'</p><div class="meta">'+new Date(x.created_at).toLocaleString('en-IN')+'</div></article>').join(''):'<div class="empty">No feedback yet.</div>')+'</section>'; }
async function load(){const d=await call('admin-list',{admin_pin:pin});render(d);}
function logout(){pin='';if(refreshTimer)clearInterval(refreshTimer);refreshTimer=null;loginScreen();}
loginScreen();
</script></body></html>
