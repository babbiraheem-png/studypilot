<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in · StudyPilot</title>
<meta name="description" content="Log in to your StudyPilot student workspace.">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff 55%,#ffffff);color:#12203a;display:grid;place-items:center;padding:24px}
.card{width:min(440px,100%);background:#fff;border:1px solid #dfe7f2;border-radius:24px;box-shadow:0 18px 60px rgba(31,60,100,.12);padding:30px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:18px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;color:#fff}
h1{margin:0 0 8px;font-size:30px}.sub{margin:0 0 24px;color:#66758b;line-height:1.5}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cbd7e8;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#4f8cff;box-shadow:0 0 0 3px rgba(79,140,255,.12)}
button{width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#1d4ed8;color:#fff;margin-top:16px}.secondary{background:#eef3fa;color:#12203a;margin-top:10px}.link{display:inline;background:none;width:auto;padding:0;color:#1d4ed8;font-weight:700}.small{font-size:12px;color:#718096;line-height:1.5;margin-top:14px}.msg{min-height:20px;margin-top:12px;font-size:13px;color:#45556d}.back{margin-top:18px;text-align:center;font-size:13px}.back a{color:#1d4ed8;text-decoration:none;font-weight:700}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><div class="mark">S</div><div>StudyPilot</div></div>
  <h1>Log in</h1>
  <p class="sub" id="welcome">Log in to your student workspace.</p>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Email address">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Your password">

  <button class="primary" id="loginBtn" onclick="login()">Log in</button>
  <button class="secondary" onclick="forgotPassword()">Forgot password?</button>

  <div class="msg" id="message"></div>
  <div class="small">StudyPilot remembers only your email on this device. It never saves your password.</div>
  <div class="back">Need an account? <button class="link" onclick="window.location.href='/'">Create account</button></div>
  <div class="back"><a href="/">← Back to StudyPilot</a></div>
</main>

<script>
const lastEmail=localStorage.getItem('studypilotLastEmail')||'';
const emailEl=document.getElementById('email');
const welcome=document.getElementById('welcome');
if(lastEmail){emailEl.value=lastEmail;welcome.textContent='Log in as '+lastEmail;}

async function login(){
  const email=emailEl.value.trim();
  const password=document.getElementById('password').value;
  const msg=document.getElementById('message');
  const btn=document.getElementById('loginBtn');
  if(!email||!email.includes('@')||!password){msg.textContent='Enter your email address and password.';return;}
  localStorage.setItem('studypilotLastEmail',email);
  msg.textContent='Logging in…';btn.disabled=true;
  try{
    const r=await fetch('/api/auth/signin',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify({email,password})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){msg.textContent=d.message||'Log in failed.';btn.disabled=false;return;}
    window.location.href='/';
  }catch(e){
    msg.textContent='Account service is temporarily unavailable.';
    btn.disabled=false;
  }
}

async function forgotPassword(){
  const email=emailEl.value.trim();
  const msg=document.getElementById('message');
  if(!email||!email.includes('@')){msg.textContent='Enter your email address first.';return;}
  localStorage.setItem('studypilotLastEmail',email);
  msg.textContent='Sending reset email…';
  try{
    const r=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});
    const d=await r.json().catch(()=>({}));
    msg.textContent=r.ok?(d.message||'Check your email for a password reset link.'):(d.message||'Could not send the reset email.');
  }catch(e){msg.textContent='Account service is temporarily unavailable.';}
}

document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

fetch('/api/account',{credentials:'include',cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{if(d?.authenticated)window.location.href='/';}).catch(()=>{});
</script>
</body>
</html>
