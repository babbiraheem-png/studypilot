<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in or Create account · StudyPilot</title>
<meta name="description" content="Log in or create a StudyPilot student account.">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eef5ff,#f8fbff 55%,#fff);color:#12203a;display:grid;place-items:center;padding:24px}
.card{width:min(460px,100%);background:#fff;border:1px solid #dfe7f2;border-radius:24px;box-shadow:0 18px 60px rgba(31,60,100,.12);padding:30px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:18px}.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#1d4ed8,#60a5fa);display:grid;place-items:center;color:#fff}
h1{margin:0 0 8px;font-size:30px}.sub{margin:0 0 20px;color:#66758b;line-height:1.5}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#eef3fa;padding:5px;border-radius:14px;margin-bottom:20px}
.tab{border:0;background:transparent;color:#66758b;border-radius:10px;padding:11px;font-size:14px;font-weight:800;cursor:pointer}
.tab.active{background:#fff;color:#1d4ed8;box-shadow:0 1px 4px rgba(20,40,80,.08)}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 7px}
input{width:100%;padding:13px 14px;border:1px solid #cbd7e8;border-radius:12px;font-size:15px;outline:none}input:focus{border-color:#4f8cff;box-shadow:0 0 0 3px rgba(79,140,255,.12)}
button.action{width:100%;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer}.primary{background:#1d4ed8;color:#fff;margin-top:16px}.secondary{background:#eef3fa;color:#12203a;margin-top:10px}.link{display:inline;background:none;width:auto;padding:0;color:#1d4ed8;font-weight:700;border:0;cursor:pointer}
.small{font-size:12px;color:#718096;line-height:1.5;margin-top:14px}.msg{min-height:22px;margin-top:12px;font-size:13px;color:#45556d}
.back{margin-top:18px;text-align:center;font-size:13px}.back a{color:#1d4ed8;text-decoration:none;font-weight:700}
.hidden{display:none}
.success{color:#147a42}

/* StudyPilot matching midnight login experience */
:root{color-scheme:dark}
body{
 background:radial-gradient(ellipse at 15% 12%,rgba(139,92,246,.13),transparent 34%),
 radial-gradient(ellipse at 88% 88%,rgba(107,91,255,.13),transparent 34%),#090b18;
 color:#f1f5f9;position:relative;overflow:hidden
}
body:before,body:after{content:"";position:fixed;pointer-events:none;border:1px solid rgba(139,92,246,.10);border-radius:50%;width:380px;height:380px;right:-170px;top:-170px}
body:after{width:240px;height:240px;left:-120px;right:auto;top:auto;bottom:-100px;border-color:rgba(130,145,255,.13)}
.card{
 position:relative;z-index:1;background:rgba(17,25,37,.94);border:1px solid #2a394a;
 border-radius:28px;box-shadow:0 32px 100px rgba(0,0,0,.35);padding:34px;
 backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
}
.logo{font-size:23px;letter-spacing:-.05em;color:#f6f8fb;margin-bottom:27px}
.mark{background:#8b5cf6;color:#160f2e;border-radius:13px;box-shadow:0 8px 28px rgba(139,92,246,.14);font-weight:950}
h1{color:#f6f8fb;font-size:34px;letter-spacing:-.055em}
.sub{color:#98a8ba;font-size:14px;line-height:1.7}
.tabs{background:#0d1520;border:1px solid #273648;border-radius:14px;padding:5px}
.tab{color:#8d9db1;border-radius:10px}
.tab.active{background:#8b5cf6;color:#160f2e;box-shadow:none}
label{color:#c3cfdd;font-size:12px;letter-spacing:.02em}
input{background:#0d1520;color:#f0f5fb;border:1px solid #2b3a4c;border-radius:12px;padding:14px}
input::placeholder{color:#687b91}
input:focus{border-color:#8b5cf6;box-shadow:0 0 0 3px rgba(139,92,246,.10)}
button.action{border-radius:12px;transition:transform .18s,background .18s}
button.action:hover{transform:translateY(-1px)}
.primary{background:#8b5cf6;color:#160f2e;margin-top:16px}
.primary:hover{background:#c4b5fd}
.secondary{background:#172231;color:#d9e3ee;border:1px solid #2a394b;margin-top:10px}
.link{color:#8b5cf6}
.small{color:#8495aa;font-size:12px;line-height:1.7}
.msg{color:#c1cddd;line-height:1.6}
.success{color:#b7f58a}
.back{color:#94a4b8}
.back a{color:#8b5cf6}
button:disabled{opacity:.65;cursor:wait}
@media(max-width:520px){body{padding:16px}.card{padding:26px 20px;border-radius:23px}h1{font-size:30px}}


/* STUDYPILOT THEME 2 — MIDNIGHT PURPLE */
:root{color-scheme:dark;--purple:#a78bfa}
body{background:radial-gradient(ellipse at 12% 12%,rgba(139,92,246,.22),transparent 36%),radial-gradient(ellipse at 90% 90%,rgba(59,130,246,.14),transparent 38%),#090b18;color:#edf0ff}
.card{border-color:rgba(167,139,250,.25);box-shadow:0 24px 90px rgba(36,18,80,.4),0 0 34px rgba(139,92,246,.09);background:rgba(17,16,39,.94);backdrop-filter:blur(18px)}
input{background:#0d0d22;color:#f5f0ff;border-color:#3c3260}
input:focus{border-color:#a78bfa;box-shadow:0 0 0 3px rgba(167,139,250,.16),0 0 18px rgba(139,92,246,.12)}
button.action{transition:transform .2s,box-shadow .2s,background .2s}
button.action:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(115deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 8px 26px rgba(139,92,246,.24)}
.primary:hover{background:linear-gradient(115deg,#c4b5fd,#8b5cf6);box-shadow:0 8px 32px rgba(139,92,246,.4)}
.secondary{background:#19162f;color:#e6dcff;border-color:#3c3260}
.link,.back a{color:#c4b5fd}
.success{color:#bbf7d0}
@keyframes purpleCardGlow{0%,100%{box-shadow:0 24px 90px rgba(36,18,80,.35),0 0 24px rgba(139,92,246,.08)}50%{box-shadow:0 24px 90px rgba(36,18,80,.45),0 0 36px rgba(139,92,246,.16)}}
.card{animation:purpleCardGlow 8s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.card{animation:none}}


@keyframes sp-login-glow{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-16px,14px,0) scale(1.06)}}
body:before{animation:sp-login-glow 18s ease-in-out infinite alternate}
body:after{animation:sp-login-glow 24s ease-in-out infinite alternate-reverse}
@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none}}

/* Animated violet aurora matching the main dashboard */
body:before{border-color:rgba(167,139,250,.15);box-shadow:0 0 80px rgba(124,58,237,.08);animation:loginOrbit 20s ease-in-out infinite alternate}
body:after{border-color:rgba(192,132,252,.18);box-shadow:0 0 70px rgba(167,139,250,.08);animation:loginOrbit 16s ease-in-out infinite alternate-reverse}
@keyframes loginOrbit{from{transform:translate3d(0,0,0) rotate(0deg)}to{transform:translate3d(12px,18px,0) rotate(8deg)}}
@media(prefers-reduced-motion:reduce){body:before,body:after{animation:none!important}}


/* RESTORED CLASSIC STUDYPILOT BLUE LOGIN THEME */
:root{color-scheme:light!important}
body{background:radial-gradient(ellipse at 15% 12%,rgba(53,120,212,.12),transparent 36%),radial-gradient(ellipse at 88% 88%,rgba(103,167,244,.13),transparent 34%),#f6f9ff!important;color:#1c2a3a!important}
body:before,body:after{border-color:rgba(53,120,212,.13)!important;box-shadow:0 0 70px rgba(53,120,212,.07)!important}
.card{background:rgba(255,255,255,.96)!important;border-color:#dce7f5!important;box-shadow:0 24px 80px rgba(35,74,125,.12)!important;color:#1c2a3a!important;backdrop-filter:blur(18px)}
.logo{color:#1c2a3a!important}.mark{background:linear-gradient(135deg,#3578d4,#67a7f4)!important;color:#fff!important;box-shadow:0 8px 24px rgba(53,120,212,.16)!important}
h1{color:#1c2a3a!important}.sub,label{color:#66758b!important}
.tabs{background:#eef3fa!important;border-color:#dfe7f2!important}.tab{color:#66758b!important}.tab.active{background:#fff!important;color:#1d4ed8!important;box-shadow:0 1px 4px rgba(20,40,80,.08)!important}
input{background:#fff!important;color:#1c2a3a!important;border-color:#cbd7e8!important}input::placeholder{color:#8997a9!important}input:focus{border-color:#4f8cff!important;box-shadow:0 0 0 3px rgba(79,140,255,.12)!important}
.primary{background:linear-gradient(135deg,#3578d4,#1d4ed8)!important;color:#fff!important;box-shadow:0 8px 22px rgba(53,120,212,.17)!important}.primary:hover{background:linear-gradient(135deg,#67a7f4,#3578d4)!important}
.secondary{background:#eef3fa!important;color:#12203a!important;border-color:#dce7f5!important}
.link,.back a{color:#1d4ed8!important}.success{color:#147a42!important}.small,.back{color:#718096!important}.msg{color:#45556d!important}
</style>
</head>
<body>
<main class="card">
  <div class="logo"><div class="mark">S</div><div>StudyPilot</div></div>
  <h1 id="title">Log in</h1>
  <p class="sub" id="subtitle">Log in to your student workspace.</p>

  <div class="tabs">
    <button class="tab active" id="loginTab" onclick="setMode('login')">Log in</button>
    <button class="tab" id="signupTab" onclick="setMode('signup')">Create account</button>
  </div>

  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Email address">

  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters">

  <button class="action primary" id="mainBtn" onclick="submitAuth()">Log in</button>
  <button class="action secondary" id="forgotBtn" onclick="forgotPassword()">Forgot password?</button>

  <div class="msg" id="message" role="status" aria-live="polite"></div>
  <div class="small">StudyPilot remembers only your email on this device. It never saves your password.</div>
  <div class="back"><a href="/">← Back to StudyPilot</a></div>
</main>

<script>
let mode=new URLSearchParams(location.search).get('mode')==='signup'?'signup':'login';
const emailEl=document.getElementById('email');
const passwordEl=document.getElementById('password');
const lastEmail=localStorage.getItem('studypilotLastEmail')||'';
if(lastEmail)emailEl.value=lastEmail;

function setMode(next){
  mode=next;
  const login=mode==='login';
  document.getElementById('title').textContent=login?'Log in':'Create your account';
  document.getElementById('subtitle').textContent=login
    ? (lastEmail?'Log in as '+lastEmail+'.':'Log in to your student workspace.')
    : 'Create your free StudyPilot student account.';
  document.getElementById('mainBtn').textContent=login?'Log in':'Create account';
  document.getElementById('forgotBtn').style.display=login?'block':'none';
  document.getElementById('password').placeholder=login?'Your password':'At least 8 characters';
  document.getElementById('password').autocomplete=login?'current-password':'new-password';
  document.getElementById('loginTab').classList.toggle('active',login);
  document.getElementById('signupTab').classList.toggle('active',!login);
  document.getElementById('message').textContent='';
}

async function submitAuth(){
  const email=emailEl.value.trim();
  const password=passwordEl.value;
  const msg=document.getElementById('message');
  const btn=document.getElementById('mainBtn');

  if(!email||!email.includes('@')){
    msg.textContent='Enter a valid email address.';
    return;
  }
  if((mode==='signup' && (password.length<8 || password.length>128)) || (mode==='login' && !password)){
    msg.textContent=mode==='signup'
      ? 'Choose a password between 8 and 128 characters.'
      : 'Enter your password.';
    return;
  }

  localStorage.setItem('studypilotLastEmail',email);
  btn.disabled=true;
  msg.className='msg';
  msg.textContent=mode==='login'?'Logging in…':'Creating your account…';

  try{
    const endpoint=mode==='login'?'/api/auth/signin':'/api/auth/signup';
    const r=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      credentials:'include',
      body:JSON.stringify({email,password})
    });
    const d=await r.json().catch(()=>({}));

    if(!r.ok){
      msg.textContent=d.message|| (mode==='login'?'Log in failed.':'Account creation failed.');
      btn.disabled=false;
      return;
    }

    if(mode==='login'){
      window.location.href='/';
      return;
    }

    if(d.authenticated){
      msg.className='msg success';
      msg.textContent='Account created. Opening StudyPilot…';
      window.location.href='/';
      return;
    }

    msg.className='msg success';
    msg.replaceChildren();
    const confirmationText=document.createElement('span');
    confirmationText.textContent=d.message||'If this email can be registered, check your inbox to confirm the account.';
    msg.appendChild(confirmationText);
    if(d.needsConfirmation){
      const resendButton=document.createElement('button');
      resendButton.type='button';
      resendButton.className='link';
      resendButton.textContent=' Resend email';
      resendButton.addEventListener('click',resendConfirmation);
      msg.appendChild(resendButton);
    }
    passwordEl.value='';
    btn.disabled=false;
  }catch(e){
    msg.textContent='Account service is temporarily unavailable.';
    btn.disabled=false;
  }
}

async function resendConfirmation(){
  const email=emailEl.value.trim();
  const msg=document.getElementById('message');
  if(!email||!email.includes('@')){msg.textContent='Enter your email address first.';return;}
  msg.className='msg';
  msg.textContent='Sending a fresh confirmation email…';
  try{
    const r=await fetch('/api/auth/resend',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    const d=await r.json().catch(()=>({}));
    msg.className=r.ok?'msg success':'msg';
    msg.textContent=d.message||(r.ok?'A fresh confirmation email was requested. Check Inbox and Spam.':'Could not resend the email.');
  }catch(e){
    msg.textContent='Account service is temporarily unavailable.';
  }
}

async function forgotPassword(){
  const email=emailEl.value.trim();
  const msg=document.getElementById('message');
  if(!email||!email.includes('@')){
    msg.textContent='Enter your email address first.';
    return;
  }
  localStorage.setItem('studypilotLastEmail',email);
  msg.textContent='Sending reset email…';
  try{
    const r=await fetch('/api/auth/reset-password',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email})
    });
    const d=await r.json().catch(()=>({}));
    msg.className=r.ok?'msg success':'msg';
    msg.textContent=d.message||(r.ok?'Check your email for a password reset link.':'Could not send the reset email.');
  }catch(e){
    msg.textContent='Account service is temporarily unavailable.';
  }
}

passwordEl.addEventListener('keydown',e=>{if(e.key==='Enter')submitAuth();});
setMode(mode);

fetch('/api/account',{credentials:'include',cache:'no-store'})
  .then(r=>r.ok?r.json():null)
  .then(d=>{if(d?.authenticated)window.location.href='/';})
  .catch(()=>{});
</script>
</body>
</html>
