<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b70"><title>StudyPilot Visitor Access</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d3048;background:#f2f7ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 10% 0,#dceaff,transparent 38%),linear-gradient(145deg,#f7faff,#edf4ff)}.card{width:min(520px,100%);background:#fff;border:1px solid #dce7f5;border-radius:26px;padding:30px;box-shadow:0 24px 70px #173c6818}.brand{font-weight:900;font-size:20px;color:#2869b8;letter-spacing:-.04em;margin-bottom:25px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.13em;color:#6482a8;text-transform:uppercase}h1{font-size:29px;line-height:1.12;letter-spacing:-.04em;margin:8px 0 10px}p{color:#687b93;line-height:1.6;font-size:14px}label{display:block;font-size:13px;font-weight:750;margin:17px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #cfdbeb;border-radius:12px;background:#fbfdff;font:inherit;color:#20344c}button,.btn{display:inline-flex;justify-content:center;align-items:center;width:100%;padding:13px 16px;border:0;border-radius:12px;background:#286fc4;color:white;font-weight:800;text-decoration:none;cursor:pointer;margin-top:17px}button:disabled{opacity:.6}.note{font-size:12px;color:#8291a4;margin-top:18px}.status{padding:13px;border-radius:13px;background:#edf5ff;color:#285b93;font-weight:700;margin-top:16px}.row{display:flex;gap:10px}.row>*{flex:1}
</style></head><body><main class="card"><div class="brand">StudyPilot</div><div class="eyebrow">Science fair · visitor entry</div><div id="app"><h1>Request access</h1><p>Fill in your name and role. The organiser must approve your request before you can enter StudyPilot.</p><form id="request"><label for="name">Full name</label><input id="name" maxlength="50" autocomplete="name" required placeholder="Your name"><label for="role">I am a</label><select id="role" required><option value="" selected disabled>Choose your role</option><option>Teacher</option><option>Judge</option><option>Student</option><option>Parent</option></select><button id="send">Send approval request</button></form><div class="note">No email address or phone number is needed. Your approval is saved only in this browser.</div></div></main><script>
const API='https://mxnhfvhvwqxjfctgfejf.supabase.co/functions/v1/studypilot-qr-access';
const KEY='sb_publishable_UdCozB9L-cEedEJgOq_t9w_Sl4aooYc';
const TOKEN_KEY='studypilotFairAccessToken';
async function call(action,extra={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify({action,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Approval service unavailable.');return d;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const app=document.getElementById('app');let poll=null;
function status(title,desc,extra=''){app.innerHTML='<h1>'+esc(title)+'</h1><p>'+esc(desc)+'</p><div class="status" id="state">Checking request status…</div>'+extra;}
async function review(token,done){app.innerHTML='<h1>Access has ended</h1><p>The organiser has closed your access. You can leave a quick review.</p>'+(done?'<div class="status">Thank you. Your review was already submitted.</div>':'<form id="review"><label>How was StudyPilot?</label><select id="rating" required><option value="">Choose a rating</option><option value="5">5 – Excellent</option><option value="4">4 – Very good</option><option value="3">3 – Good</option><option value="2">2 – Fair</option><option value="1">1 – Needs improvement</option></select><label>Comment (optional)</label><textarea id="comment" maxlength="500" rows="4" placeholder="Share a suggestion"></textarea><button>Submit review</button></form>');const form=document.getElementById('review');if(form)form.onsubmit=async e=>{e.preventDefault();try{await call('review-submit',{visitor_token:token,rating:Number(document.getElementById('rating').value),review_text:document.getElementById('comment').value});review(token,true);}catch(err){alert(err.message);}};}
async function check(){const token=localStorage.getItem(TOKEN_KEY);if(!token)return;try{const d=await call('status',{visitor_token:token});const state=document.getElementById('state');if(d.status==='pending'){if(state)state.textContent='Waiting for organiser approval';}else if(d.status==='approved'){if(poll)clearInterval(poll);status('You are approved!','Your access has been approved on this device.','<a class="btn" href="/">Open StudyPilot</a>');}else if(d.status==='rejected'){if(poll)clearInterval(poll);localStorage.removeItem(TOKEN_KEY);status('Request not approved','Please speak to the organiser if you think this is a mistake.','<button onclick="location.reload()">Back</button>');}else if(d.status==='revoked'){if(poll)clearInterval(poll);review(token,d.review_submitted);}else{if(poll)clearInterval(poll);localStorage.removeItem(TOKEN_KEY);status('Request not found','Please submit a new access request.','<button onclick="location.reload()">Start again</button>');}}catch(e){const s=document.getElementById('state');if(s)s.textContent=e.message;}}
document.getElementById('request').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('send');btn.disabled=true;btn.textContent='Sending…';try{const d=await call('request',{name:document.getElementById('name').value.trim(),role:document.getElementById('role').value});localStorage.setItem(TOKEN_KEY,d.visitor_token);status('Request sent','Your request is in the organiser’s approval queue. Keep this page open.');await check();poll=setInterval(check,5000);}catch(err){alert(err.message);btn.disabled=false;btn.textContent='Send approval request';}};
(async()=>{const existing=localStorage.getItem(TOKEN_KEY);if(existing){status('Checking your request','We are checking your existing access request.');await check();if(localStorage.getItem(TOKEN_KEY))poll=setInterval(check,5000);return;}try{const s=await call('settings');if(!s.access_enabled){const note=document.createElement('div');note.className='status';note.textContent='Visitor requests are paused. Please ask the organiser when visitor access will reopen.';app.appendChild(note);document.getElementById('send').disabled=true;}}catch(e){const note=document.createElement('div');note.className='status';note.textContent='The form is ready. If sending fails, please check your internet connection and try again.';app.appendChild(note);}})();
</script></body></html>
